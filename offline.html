<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#023B4A">
  <title>Tidak ada koneksi — IP GUARD</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: Inter, Roboto, "Segoe UI", sans-serif; background: #012530; color: #e7f3f8;
           display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
           padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom)); }
    .box { max-width: 340px; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { font-size: 1.25rem; margin: 20px 0 8px; color: #fff; }
    p { font-size: .95rem; line-height: 1.5; color: #b7d3dd; margin: 0 0 24px; }
    button { background: #F7E82E; color: #012530; border: 0; border-radius: 12px; font-weight: 700;
             font-size: 1rem; padding: 12px 28px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="icons/icon-192.png" alt="">
    <h1>Tidak ada koneksi internet</h1>
    <p>IP GUARD butuh internet untuk menyimpan dan membaca data. Periksa sinyal atau Wi-Fi, lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
